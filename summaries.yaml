# Bilingual notes written by Codex after reading each project's actual README.
# Refresh both locales and readme_sha together when the source changes.
schema_version: 1
projects:
  JetBrains/thinkrail:
    readme_sha: fff39cb4167ffa5c5e323d233a50febfcbcb535e
    en:
      purpose: An agent-focused IDE built around the pi coding agent, combining code editing, isolated workspaces, and durable project knowledge.
      highlights:
        - Git worktrees give parallel tasks separate branches and working directories, with integrated pull request and review controls.
        - A Monaco editor, terminals, file changes, and anchored review comments sit beside the agent conversation.
        - Living SPEC.md documents and reusable skills preserve project intent across sessions.
    zh-CN:
      purpose: 围绕 pi 编程智能体构建的 IDE，把代码编辑、隔离工作区和持久化项目知识放进同一个界面。
      highlights:
        - 使用 Git worktree 为并行任务提供独立分支和目录，并集成 PR、审查与合并操作。
        - 智能体对话旁可直接使用 Monaco 编辑器、终端、文件变更视图和定位到代码的审查意见。
        - 通过持续维护的 SPEC.md 文档和可复用技能，让项目意图跨会话保留。
  elayadesign/ai-design-skills:
    readme_sha: 32677792be09e0b9fba13b10c2f94a804c488900
    en:
      purpose: A modular collection of design skills for AI coding tools that can read Markdown rules.
      highlights:
        - Skills live in self-contained folders, so users install only the ones they need.
        - The current landing-page-design skill covers intake questions, page structure, and conversion copy.
        - Its visual guidance includes typography, spacing, corner radius, and motion; support is not tied to one coding agent.
    zh-CN:
      purpose: 面向 AI 编程工具的模块化设计技能集合，适用于能够读取 Markdown 规则的智能体。
      highlights:
        - 每项技能是独立文件夹，可以按需安装，而不必引入整套规则。
        - 当前的 landing-page-design 技能覆盖需求提问、页面结构和转化文案。
        - 视觉指导包含字体、间距、圆角和动效，可用于多种编程智能体。
  obra/superpowers:
    readme_sha: c5bb59fdaf17ba154e803c549cd71a73ef36c24b
    en:
      purpose: A composable skills framework that gives coding agents a software development process, from clarifying requirements to reviewing and finishing changes.
      highlights:
        - Turns an agreed design into small implementation tasks with explicit files and verification steps.
        - Includes test-driven development, systematic debugging, and verification-before-completion skills.
        - Supports isolated worktrees and either task-by-task agent execution or an inline implementation workflow with review.
    zh-CN:
      purpose: 通过可组合技能，为编程智能体提供从澄清需求到审查和交付变更的软件开发流程。
      highlights:
        - 将已确认的设计拆成小任务，明确涉及的文件和验证步骤。
        - 包含测试驱动开发、系统化调试，以及完成前验证等技能。
        - 支持隔离 worktree，可选择逐任务智能体执行，或在当前会话内实施后统一审查。
  HKUDS/DeepTutor:
    readme_sha: aa5ccfc3c70844364839428d772f2a70a196adf5
    en:
      purpose: An agent-native learning workspace connecting personalized tutoring, problem solving, quizzes, research, and study practice.
      highlights:
        - Learning modes share a capability runtime and session context while keeping workflows tailored to each task.
        - Reuses knowledge bases, books, notebooks, question banks, and memory across supported learning workflows.
        - Video reading combines playback, transcript search, timestamp-grounded tutoring, saved notes, and resumable progress.
    zh-CN:
      purpose: 以智能体为核心的学习工作区，把个性化辅导、解题、测验、研究和学习练习连接起来。
      highlights:
        - 不同学习模式共享能力运行时和会话上下文，同时保留各自的专用流程。
        - 可在支持的学习流程之间复用知识库、书籍、笔记、题库和记忆。
        - 视频阅读结合播放、字幕搜索、基于时间戳的辅导、笔记保存和进度续接。
  macro-inc/macro:
    readme_sha: 9d8cd478cef941c2024d06e62d563481902aef61
    en:
      purpose: A shared team workspace that brings email, messages, documents, tasks, agents, and CRM into one connected system.
      highlights:
        - Cross-references between documents, tasks, messages, and emails form a native bidirectional graph.
        - Collaborative Markdown documents use CRDTs, alongside purpose-built inboxes, channels, tasks, and canvases.
        - Team-level agent memory can draw on connected workspace content, including recorded and transcribed calls.
    zh-CN:
      purpose: 将邮件、聊天、文档、任务、智能体和 CRM 整合到同一套关联数据中的团队工作区。
      highlights:
        - 文档、任务、消息和邮件之间的引用原生保存为双向关系图。
        - 基于 CRDT 的协作文档与专用收件箱、频道、任务和画布共同工作。
        - 智能体共享团队级记忆，能够利用互相关联的工作内容，包括录制和转写的通话。
  Nutlope/hallmark:
    readme_sha: 2568bb6f51284bc3feeea6a3098d31f6743ec623
    en:
      purpose: A design skill for coding agents that builds and reviews websites around their actual purpose while reducing repetitive AI-generated visual patterns.
      highlights:
        - Provides fifty visual themes and a custom design path driven by the user's brief.
        - Uses a real browser to check the result, with separate accessibility, layout, and design-detail gates.
        - Offers redesign and audit workflows and can capture the user's actual site or app as visual context.
    zh-CN:
      purpose: 面向编程智能体的网页设计技能，围绕页面的实际任务完成设计和检查，减少千篇一律的 AI 生成风格。
      highlights:
        - 提供五十套视觉主题，也可根据用户需求定制设计。
        - 在真实浏览器中检查结果，将无障碍、布局和设计细节分层验收。
        - 提供重新设计和审计流程，并可抓取用户实际网站或应用作为视觉上下文。
  pbakaus/impeccable:
    readme_sha: 8f27aa965cb56ab578d637e53f0392ae4e2d06db
    en:
      purpose: A design vocabulary and review toolkit that helps coding agents improve existing interfaces through targeted visual instructions.
      highlights:
        - Commands such as polish, bolder, and critique express specific design changes rather than vague requests.
        - Audits cover accessibility, performance, theming, and responsive behavior, with findings prioritized by severity.
        - A deterministic checker flags 62 common design and quality problems without requiring an LLM or API key for that check.
    zh-CN:
      purpose: 为编程智能体提供设计词汇和审查工具，通过明确的视觉指令改进已有界面。
      highlights:
        - 使用 polish、bolder、critique 等命令表达具体设计动作，减少模糊指令带来的猜测。
        - 审计覆盖无障碍、性能、主题和响应式行为，并按严重程度排序问题。
        - 确定性检查器识别 62 类常见设计与质量问题，这部分检查不需要模型或 API Key。
  makecindy/cindy:
    readme_sha: 0d3c698b5d03b65ca10fdefb4d3a49a1d19bde22
    en:
      purpose: An open-source AI agent client that connects computers and phones so users can continue work across devices with their existing agent tools and model providers.
      highlights:
        - Continues sessions across connected devices and offers remote access to files, providers, and the desktop when enabled.
        - Brings Claude Code, Codex, and Pi into one interface, with supported subscriptions, API providers, and local models.
        - This repository contains desktop and mobile clients plus shared packages; the backend is maintained separately.
    zh-CN:
      purpose: 连接电脑与手机的开源 AI 智能体客户端，让用户使用已有智能体工具和模型服务跨设备继续工作。
      highlights:
        - 可跨已连接设备继续会话，并在启用相应权限后远程访问文件、模型服务和桌面。
        - 在统一界面中整合 Claude Code、Codex 和 Pi，支持部分订阅、API 服务和本地模型。
        - 此仓库包含桌面端、移动端和共享组件，后端服务位于独立仓库。
  nightly-labs/openbot:
    readme_sha: c895cf81d1cc77b64996ea44301bf7cb0fabb48c
    en:
      purpose: A local-first desktop workspace for persistent AI teammates, each with its own conversation, working directory, and agent provider.
      highlights:
        - Supports several coding-agent backends and ACP integrations, with per-agent model and context settings.
        - Persistent message queues, agent messaging, file transfers, and shared channels coordinate ongoing work.
        - An embedded browser and optional computer-use tools extend agents beyond terminal commands; the project is a development preview.
    zh-CN:
      purpose: 以本地为主的桌面智能体工作区，为长期运行的 AI 协作者提供独立会话、工作目录和模型后端。
      highlights:
        - 支持多种编程智能体后端及 ACP 集成，并可分别设置模型和上下文。
        - 通过持久化消息队列、智能体消息、文件传输和共享频道协调持续工作。
        - 内置浏览器和可选的电脑操作工具，将任务范围扩展到终端之外；目前仍是开发预览版。
  togg53192-cmd/jailbreaks:
    readme_sha: d3d7aa5f46bffbcf06da82b784a199381096cff3
    en:
      purpose: A research-oriented collection of model prompts and agent configuration examples for studying instruction handling and model behavior.
      highlights:
        - Covers system prompts, persona definitions, workspace policies, and agent operating specifications.
        - Includes examples for closed and open-weight model families and several agent-specific configuration formats.
        - The README frames the material as research on instruction conflicts and resistance to prompt injection.
    zh-CN:
      purpose: 面向研究的模型提示词与智能体配置资料集，用于观察指令处理方式和模型行为。
      highlights:
        - 收集系统提示词、角色定义、工作区策略和智能体运行规范。
        - 覆盖闭源与开放权重模型系列，以及多种智能体专用配置格式。
        - README 将其定位于指令冲突和提示注入防御相关研究材料。
  hmjz100/LinkSwift:
    readme_sha: e5f54f3ae10ef773ff600d4681fe2cbc5f6322a4
    en:
      purpose: A browser userscript that obtains direct download links from supported cloud drives and connects them to external download tools.
      highlights:
        - Supports nine cloud-drive services, including Baidu, Aliyun, Quark, and 123pan.
        - Combines direct-link retrieval, interface customization, and integrations with download managers.
        - Uses providers' public APIs; the README explicitly distinguishes link retrieval from bypassing download speed limits.
    zh-CN:
      purpose: 在浏览器中获取网盘下载直链，并与外部下载工具衔接的用户脚本。
      highlights:
        - 支持百度网盘、阿里云盘、夸克网盘、123 云盘等九类网盘服务。
        - 结合直链获取、界面美化和多种下载器集成。
        - 使用网盘公开 API 获取链接，README 明确说明不具备破解下载限速的能力。
  expo/skills:
    readme_sha: ec0de77b01fedee1fc814a46fd9d88e54ce13243
    en:
      purpose: Official Expo skills that teach coding agents how to build, debug, upgrade, and deploy Expo and React Native applications.
      highlights:
        - Framework skills cover routing, native UI, animation, data fetching, native modules, and SDK upgrades.
        - Separately labels workflows involving paid EAS services, including builds, hosting, updates, and observability.
        - Plugin installations bundle an Expo MCP connection for live documentation and development workflows.
    zh-CN:
      purpose: Expo 官方提供的编程智能体技能，覆盖 Expo 与 React Native 应用的开发、调试、升级和部署。
      highlights:
        - 框架技能涵盖路由、原生 UI、动画、数据获取、原生模块和 SDK 升级。
        - 将涉及付费 EAS 服务的构建、托管、更新和可观测性流程单独标注。
        - 插件安装包含 Expo MCP 连接，可访问实时文档并执行相关开发流程。
  ruvnet/RuView:
    readme_sha: 98c12d7458694f70bfc68634638ca88429026f7f
    en:
      purpose: A WiFi sensing project exploring presence detection and spatial awareness without cameras, with integrations for smart-home systems.
      highlights:
        - Exposes room and sensor signals through Home Assistant and other supported smart-home integrations.
        - Documents separate maturity levels for validated checkpoints, experimental on-device models, and architecture-only components.
        - Benchmark pose results are distinct from live single-ESP32 performance; the README identifies limitations and a still-stubbed on-device pose path.
    zh-CN:
      purpose: 探索利用 WiFi 信号进行人员存在感知和空间感知的项目，无需摄像头，并提供智能家居集成。
      highlights:
        - 可通过 Home Assistant 等支持的集成暴露房间状态和传感信号。
        - 明确区分已验证模型、实验性端侧模型和仅有架构的组件，标注不同成熟度。
        - 基准数据集上的姿态结果不等于单 ESP32 实时效果，README 说明了局限及尚未接通的端侧姿态运行路径。
  xiaolai/the-craft-of-selfteaching:
    readme_sha: 4bd498a7aaccb7151249ba83832d67bbb4598751
    en:
      purpose: Li Xiaolai's open-source book on self-teaching, distributed as notebooks that readers can study locally and help improve.
      highlights:
        - Recommends a local JupyterLab setup for an interactive reading experience.
        - Links to a separate Markdown edition for readers who prefer plain-text documents.
        - Provides a pull request proofreading workflow so readers can contribute corrections.
    zh-CN:
      purpose: 李笑来的开源书稿《自学是门手艺》，以 Notebook 形式提供本地阅读，并开放读者参与完善。
      highlights:
        - 推荐安装 JupyterLab，在本地获得更好的交互阅读体验。
        - 提供独立 Markdown 版本的链接，方便偏好纯文本文档的读者。
        - 说明了通过 Pull Request 参与校对的流程，读者可以贡献修订。
