<!doctype html>
<html lang="$locale" data-page="$page_kind">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="color-scheme" content="light dark">
  <title>$page_title</title>
  <style>$css</style>
</head>
<body id="top">
  <a class="skip-link" href="#projects">$skip</a>
  <div class="reading-progress" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="$latest_href"><span class="brand-mark" aria-hidden="true">t<span>↗</span></span>$brand</a>
    <div class="header-actions">
      <nav class="primary-nav" aria-label="Main"><a href="$latest_href">$latest</a><a href="$archive_href">$archive</a></nav>
      $locale_links
      <button id="theme" class="icon-button" aria-label="$theme" title="$theme" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg></button>
      <button id="print" class="icon-button" aria-label="$print_label" title="$print_label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7Z"/><path d="M16 11h1"/></svg></button>
    </div>
  </header>
  <main class="page">
    <section class="hero" aria-labelledby="page-heading">
      <div class="hero-copy"><div class="issue-line"><span class="eyebrow">$edition</span><span class="issue-date"><span class="status-dot" aria-hidden="true"></span><time datetime="$iso_date">$date</time></span></div>
        <h1 id="page-heading">$title</h1><p class="hero-intro">$intro</p></div>
      <div class="issue-stats">$stats</div>
    </section>
$content
  </main>
  <footer class="site-footer"><div><a class="footer-brand" href="$latest_href">$brand</a><p>$footer</p></div><div class="footer-links"><a href="$source_url" target="_blank" rel="noopener noreferrer">$source_link ↗</a><a href="#top">$back ↑</a></div></footer>
  <script>$script</script>
</body>
</html>
