[project]
name = "github-trending-digest"
version = "0.1.0"
description = "A daily, source-linked GitHub Trending technology digest."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["beautifulsoup4>=4.13,<5", "tzdata>=2025.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trending_digest"]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
