name: Daily Trending Digest

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trending-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - run: uv sync --project app --frozen --no-dev --python 3.12
      - name: Check cloud model configuration
        id: model
        run: |
          uv run --project app --no-dev python - <<'PY'
          import ipaddress
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from trending_digest.config import load_config

          settings = load_config(Path("conf.yaml"))["llm"]
          host = urlsplit(settings["base_url"]).hostname
          local = host == "localhost"
          try:
              address = ipaddress.ip_address(host)
              local = local or address.is_loopback or address.is_unspecified
          except ValueError:
              pass
          enabled = bool(settings["model"].strip()) and not local
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          if not enabled:
              print("::notice::Skipping: configure a model reachable from this runner. "
                    "GitHub-hosted runners cannot access your local Ollama server.")
          PY
      - name: Generate digest
        if: steps.model.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run --project app --no-dev python -m trending_digest
      - name: Commit and push
        if: steps.model.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs
          if git diff --cached --quiet; then
            echo "No digest changes."
            exit 0
          fi
          git commit -m "docs: update daily trending digest"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
